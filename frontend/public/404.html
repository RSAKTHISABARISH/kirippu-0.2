<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>KURIPPU</title>
  <script>
    // GitHub Pages SPA fix: redirect 404s back to index.html with the path encoded
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1).join('/') +
      '/?p=' + encodeURIComponent(l.pathname + l.search) + l.hash
    );
  </script>
</head>
</html>
